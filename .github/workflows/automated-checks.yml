#          DB_PASSWORD: temp_password_aa_tox_tests
#        run: tox -v -e ${{ env.TOX_ENV }}
        run: tox -v

      # Upload coverage to Codecov
#      - name: Upload Coverage
#        if: ${{
#              (
#                github.event_name == 'pull_request'
#                || (
#                  github.event_name == 'push'
#                  && github.ref == 'refs/heads/master'
#                )
#              )
#              && (
#                matrix.python-version == env.COVERAGE_PYTHON_VERSION
#                && matrix.database == env.COVERAGE_DATABASE_VERSION
#              )
#            }}
#        uses: codecov/codecov-action@v5
#        with:
##          token: ${{ secrets.CODECOV_TOKEN }}
#          files: coverage.xml # optional
##          flags: unittests # optional
##          name: codecov-umbrella # optional
##          fail_ci_if_error: true # optional (default = false)
#          verbose: true # optional (default = false)
#        env:
#          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Release & Publish Job
  release:
    needs: [ test-coverage ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/test' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    name: Release & Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
    permissions:
      contents: write
      id-token: write

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'

      # Check if version is bumped / new
      - name: Check Package Version
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import aa_bb; print(aa_bb.__version__)" 2>/dev/null || python -c "import re; print(re.search(r'__version__\s*=\s*[\"\'\']([^\"\'\']+)[\"\'\']', open('aa_bb/__init__.py').read()).group(1))")
          echo "Current package version is $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          TAG_NAME="v$VERSION"
          IS_NEW=true

          # Check if GitHub Release or Tag exists
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists."
            IS_NEW=false
          elif gh release view "$VERSION" > /dev/null 2>&1; then
            echo "GitHub release $VERSION already exists."
            IS_NEW=false
          elif git rev-parse "$TAG_NAME" > /dev/null 2>&1 || git rev-parse "refs/tags/$TAG_NAME" > /dev/null 2>&1; then
            echo "Git tag $TAG_NAME already exists."
            IS_NEW=false
          fi

          # Check if version exists on PyPI
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/aa_bb/$VERSION/json")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Version $VERSION already exists on PyPI."
            IS_NEW=false
          fi

          if [ "$IS_NEW" = "true" ]; then
            echo "New version $VERSION detected. Proceeding with merge, build, PyPI publishing, and GitHub release."
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is not a new version (already released on GitHub or PyPI). Skipping release."
            echo "is_new_version=false" >> $GITHUB_OUTPUT
          fi

      # Merge test branch into main (verifying merge happens without errors)
      - name: Merge test into main
        if: steps.check_version.outputs.is_new_version == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin test
          git checkout main
          if ! git merge origin/test --no-edit -m "Merge test into main for release ${{ steps.check_version.outputs.version }} [skip ci]"; then
            echo "::error::Merge failed due to conflicts or errors"
            exit 1
          fi
          git push origin main

      # Test PyPI Build
      - name: Test PyPI Build
        if: steps.check_version.outputs.is_new_version == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m pip install --upgrade setuptools wheel
          python -m build

      # Publish to PyPI using Trusted Publishing
      - name: Publish to PyPI
        if: steps.check_version.outputs.is_new_version == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      # Create GitHub Release with dist artifacts
      - name: Create GitHub Release
        if: steps.check_version.outputs.is_new_version == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ steps.check_version.outputs.version }}"
          echo "Creating GitHub Release $TAG_NAME"
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --generate-notes
