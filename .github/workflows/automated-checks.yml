name: Automated Checks and Release

env:
  COVERAGE_DATABASE_VERSION: mariadb:10.11
  COVERAGE_PYTHON_VERSION: 3.11
  NODE_VERSION: 26 # [LTS] End of Life: 30 Apr 2029 (https://endoflife.date/nodejs)
  REDIS_VERSION: latest

on:
  push:
    branches:
      - '**'

    tags-ignore:
      - '**'

  pull_request:
    branches:
      - '**'

    tags-ignore:
      - '**'

jobs:
  # Run pre-commit Checks
  pre-commit:
    name: Pre Commit Checks
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v7

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Set up Node.js
#      - name: Setup Node.js
#        uses: actions/setup-node@v6
#        with:
#          # https://endoflife.date/nodejs
#          node-version: ${{ env.NODE_VERSION }}
#          cache: 'npm'
#          cache-dependency-path: 'package-lock.json'
#      - run: npm install

      - name: Run Pre Commit Checks
        uses: pre-commit/action@v3.0.1

  # Run Test Coverage for Laatest Release
  test-coverage:
