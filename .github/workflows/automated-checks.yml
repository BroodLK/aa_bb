#          - mariadb:11.4  # [LTS] Maintained until: 29 May 2029
#          - mariadb:11.8  # [LTS] Maintained until: 04 Jun 2028
#          - mariadb:12.3  # [LTS] Maintained until: 30 Jun 2029
