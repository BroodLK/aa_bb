[tox]
requires =
    tox>=4.2
env_list =
    py{314, 313, 312, 311}

[testenv]
deps =
    allianceauth>=5.5
    coverage
    django-webtest
set_env =
    DJANGO_SETTINGS_MODULE = testauth.settings.local
commands =
    coverage run runtests.py aa_bb -v 2
    coverage report
    coverage xml
install_command = python -m pip install -U {opts} {packages}
