<!--
  Simple splash page for when Corp Brother is intentionally disabled.
  Reuses the base layout but replaces the dashboard cards with a static alert.
-->
{% extends 'aa_cb/base.html' %}
{% load i18n %}
{% load humanize %}

{% block details %}

<!-- Error / Info Message -->
<div id="messageBox" class="alert alert-danger">
    {{ message|default:"Corp Brother is currently inactive. Please review the configuration and re-enable the plugin when ready." }}
</div>

{% endblock %}

{% block extra_javascript %}

{% endblock %}
