<!--
  Splash page presented when Big Brother itself is disabled.
  Keeps the standard layout but replaces the card grid with a single alert.
-->
{% extends 'aa_bb/base.html' %}
{% load i18n %}
{% load humanize %}

{% block details %}

<!-- Error / Info Message -->
<div id="messageBox" class="alert alert-danger">
    {{ message|default:"Big Brother is currently inactive. Please review the configuration and re-enable the plugin when ready." }}
</div>

{% endblock %}

{% block extra_javascript %}

{% endblock %}
